[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-security-monitor"
version = "1.0.0"
description = "A safe, configuration-driven TCP and HTTP availability monitor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Idowu Ayoola Olawoore" }]

[project.scripts]
netwatch = "netwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


